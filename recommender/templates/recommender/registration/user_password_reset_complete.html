{% extends 'recommender/base.html' %}

{% block title %}Password Changed{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-10rem)]">
    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-2xl shadow-lg text-center">
        <div class="inline-block bg-indigo-100 p-4 rounded-full mb-4">
            <i data-feather="unlock" class="w-8 h-8 text-indigo-600"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-800">Password Changed!</h1>
        <p class="text-gray-500 mt-2">Your password has been successfully set. You can now log in with your new credentials.</p>
        <div class="mt-6">
            <a href="{% url 'user_login' %}" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
                Log In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
